# Tests and builds. Deploys nothing.
#
# Runs on its own for pull requests into qa/main, and is called by
# qa.yml (push to qa -> Render) and production.yml (push to main -> Lightsail)
# so that nothing is deployed unless this passed for that exact commit.

name: CI

on:
  pull_request:
    branches: [qa, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      frontend_api_url:
        description: API base URL baked into the web build (public, not a secret)
        type: string
        default: https://api.curapath.in/api
      upload_frontend:
        description: Keep frontend/dist as an artifact for a later deploy job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are dropped; branch pushes always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: curapath
          POSTGRES_PASSWORD: curapath
          POSTGRES_DB: curapath
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U curapath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only values. No production credential is ever available
      # to this job: there is no .env in the repo, and no secrets are passed.
      DATABASE_URL: postgres://curapath:curapath@localhost:5432/curapath
      DJANGO_SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
      MPIN_PEPPER: ci-only-not-a-secret-pepper
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: |
          python manage.py check
          python manage.py check --deploy --fail-level ERROR

      - name: Models and migrations are in sync
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations apply cleanly on PostgreSQL
        run: python manage.py migrate --noinput

      - name: Static files collect
        run: python manage.py collectstatic --noinput > /dev/null

      - name: Tests
        run: python manage.py test --noinput

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        env:
          # VITE_* values are compiled into public JavaScript — they are
          # settings, not secrets. Never put a secret in a VITE_ variable.
          VITE_USE_PRODUCTION_API: 'true'
          VITE_API_BASE_URL_PROD: ${{ inputs.frontend_api_url || 'https://api.curapath.in/api' }}
        run: npm run build

      - name: Built bundle contains no credentials
        run: |
          if grep -rEl 'sk-ant-|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY|"private_key"' dist; then
            echo "::error::A credential-like string was found in frontend/dist (files listed above)."
            exit 1
          fi

      - name: Keep build for deployment
        if: inputs.upload_frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 30
          if-no-files-found: error
